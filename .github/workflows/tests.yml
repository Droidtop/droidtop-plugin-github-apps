name: Unit tests

# Version comparison, asset selection, address and release parsing, the Obtainium import and the APK reader
# (test/Tests.kt), on a plain JVM. The Kotlin version is the one droidtop's :plugin-host is built with.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  KOTLIN_VERSION: "2.2.21"

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install kotlinc
        run: |
          curl -sL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o "$RUNNER_TEMP/kotlinc.zip"
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run the tests
        run: ./test/run.sh
